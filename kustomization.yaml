apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
# Cada cambio en index.html genera un ConfigMap con hash nuevo,
# lo que fuerza un rollout de los pods automáticamente.
configMapGenerator:
  - name: hola-html
    files:
      - index.html
